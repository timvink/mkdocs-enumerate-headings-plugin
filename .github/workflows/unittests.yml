name: Unit tests
on: [pull_request]
jobs:
  run:
    name: Run unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: 
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.8, 3.9, "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
    - name: Setup Python
      uses: actions/setup-python@2241d846baea6518b39bec0fb3859d75cb3d3c50 # master
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Static code checking with pyflakes
      run: |
        pip install pyflakes
        pyflakes mkdocs_enumerate_headings_plugin
    - name: Run unit tests
      run: |
        pip install -r tests/test_requirements.txt
        pip install -e .
        pytest --cov=mkdocs_enumerate_headings_plugin --cov-report=xml