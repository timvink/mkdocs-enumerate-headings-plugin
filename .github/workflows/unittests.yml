name: Unit tests
on: [pull_request]
permissions:
  contents: read

jobs:
  run:
    name: Run unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: 
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.8, 3.9, "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
          # Ubuntu 26.04 (ubuntu-latest) has no Python 3.8 build; 3.8 still runs on macOS and Windows.
          - os: ubuntu-latest
            python-version: 3.8
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Static code checking with pyflakes
      run: |
        pip install pyflakes
        pyflakes mkdocs_enumerate_headings_plugin
    - name: Run unit tests
      run: |
        pip install -r tests/test_requirements.txt
        pip install -e .
        pytest --cov=mkdocs_enumerate_headings_plugin --cov-report=xml